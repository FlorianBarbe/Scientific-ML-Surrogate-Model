[project]
name = "scientific-ml-surrogate-model"
version = "0.1.0"
description = "Surrogate modeling por parametrized scientific simulations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tensorflow[and-cuda]>=2.21.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
